[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talaria-hermes-plugin"
version = "0.2.0"
description = "Transactional Talaria phone bridge for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AethyrionAI" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Plugins",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/AethyrionAI/talaria-plugin"

[project.entry-points."hermes_agent.plugins"]
talaria = "talaria"

[tool.setuptools]
packages = ["talaria"]
