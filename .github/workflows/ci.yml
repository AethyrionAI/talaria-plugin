name: Plugin CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned Hermes and test dependencies
        run: |
          python -m pip install --upgrade pip pytest pytest-asyncio
          # `qrcode` backs `hermes talaria pair-qr`. It is NOT a Hermes core
          # dependency — it ships only with the `messaging`, `dingtalk`, and
          # `feishu` extras — so `pip install -e hermes-agent` below does not
          # bring it. Pinned to Hermes's own pin so CI cannot drift from the
          # version a host installed with those extras already has.
          python -m pip install 'qrcode==7.4.2'
          # Pinned to the SHA named in README's tested-against line
          # (tests/test_compat_floor.py keeps the two in lockstep).
          git init -q /tmp/hermes-agent
          git -C /tmp/hermes-agent fetch --depth 1 https://github.com/NousResearch/hermes-agent.git 503d863fcd2cbfc0be5a6d6c536fae2e98aa4204
          git -C /tmp/hermes-agent checkout -q --detach FETCH_HEAD
          python -m pip install -e /tmp/hermes-agent

      - name: Test through the conventional package layout
        run: |
          pytest tests/ -q
          python -m pytest tests/ -q

      - name: Compile all Python modules
        run: python -m compileall -q .

      - name: Validate the directory plugin
        run: hermes plugins doctor . --ci

